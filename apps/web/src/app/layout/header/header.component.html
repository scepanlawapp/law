<header class="header">
	<label class="search-box">
		<mat-icon aria-hidden="true">search</mat-icon>
		<input type="search" placeholder="Search clients, cases, documents..." />
	</label>

	<div class="header-actions">
		<button class="icon-button notification-button" type="button" aria-label="Notifications">
			<mat-icon>notifications_none</mat-icon>
			<span class="notification-count">3</span>
		</button>
		<span class="avatar" aria-hidden="true">SP</span>
		<span class="user-name">Scepane</span>
		<mat-icon class="chevron" aria-hidden="true">expand_more</mat-icon>
	</div>
</header>
