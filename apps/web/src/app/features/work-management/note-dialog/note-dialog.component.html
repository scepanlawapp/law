<hlm-dialog-header>
  <h2 hlmDialogTitle>
    {{ (editing ? "work.notes.edit" : "work.notes.create") | translate }}
  </h2>
  <p hlmDialogDescription>{{ "work.notes.formDescription" | translate }}</p>
</hlm-dialog-header>
<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4" novalidate>
  <div hlmField>
    <label hlmFieldLabel for="note-type">{{ "work.type" | translate }}</label>
    <select
      id="note-type"
      formControlName="type"
      class="h-10 rounded-md border border-input bg-background px-3 text-sm"
    >
      @for (type of types; track type) {
        <option [value]="type">
          {{ "work.noteType." + type.toLowerCase() | translate }}
        </option>
      }
    </select>
  </div>
  <div hlmField>
    <label hlmFieldLabel for="note-occurred-at">
      {{ "work.occurredAt" | translate }}
    </label>
    <input
      hlmInput
      id="note-occurred-at"
      type="datetime-local"
      formControlName="occurredAt"
    />
  </div>
  <div hlmField>
    <label hlmFieldLabel for="note-body">
      {{ "work.notes.body" | translate }}
    </label>
    <textarea
      hlmTextarea
      id="note-body"
      rows="8"
      formControlName="body"
    ></textarea>
  </div>
  <hlm-dialog-footer class="flex justify-end gap-2">
    <button
      hlmBtn
      type="button"
      variant="outline"
      [disabled]="saving()"
      (click)="dialogRef.close()"
    >
      {{ "common.cancel" | translate }}
    </button>
    <button hlmBtn type="submit" [disabled]="saving()">
      @if (saving()) {
        <hlm-spinner />
      }
      {{ "common.save" | translate }}
    </button>
  </hlm-dialog-footer>
</form>
