@if (prompt.current(); as source) {
  <section
    class="border-border bg-popover text-popover-foreground fixed right-4 bottom-4 z-50 flex w-80 max-w-[calc(100vw-2rem)] flex-col gap-3 rounded-2xl border p-4 shadow-lg"
    role="group"
    aria-labelledby="completion-prompt-title"
  >
    <div class="flex flex-col gap-1">
      <h2 id="completion-prompt-title" class="text-sm font-semibold">
        {{ "time.completion.title" | translate }}
      </h2>
      <p class="text-muted-foreground truncate text-sm" [title]="source.title">
        {{ source.title }}
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      @for (chip of minuteChips; track chip) {
        <button
          hlmBtn
          type="button"
          size="sm"
          [variant]="source.defaultMinutes === chip ? 'default' : 'outline'"
          [attr.aria-pressed]="source.defaultMinutes === chip"
          (click)="prompt.confirm(chip)"
        >
          {{ chip }} {{ "time.capture.minuteUnit" | translate }}
        </button>
      }
      <button
        hlmBtn
        type="button"
        size="sm"
        [variant]="customMinutes(source.defaultMinutes) ? 'default' : 'outline'"
        (click)="prompt.other()"
      >
        {{ "time.completion.other" | translate }}
        @if (customMinutes(source.defaultMinutes); as minutes) {
          ({{ minutes }} {{ "time.capture.minuteUnit" | translate }})
        }
      </button>
      <button
        hlmBtn
        type="button"
        size="sm"
        variant="ghost"
        (click)="prompt.skip()"
      >
        {{ "time.completion.skip" | translate }}
      </button>
    </div>
  </section>
}
