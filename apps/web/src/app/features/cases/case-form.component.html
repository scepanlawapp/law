<h1>{{ (caseId ? "cases.edit" : "cases.create") | translate }}</h1>
@if (loading()) {
  <p>{{ "cases.loading" | translate }}</p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div hlmField>
      <label hlmFieldLabel for="clientId">{{
        "cases.client" | translate
      }}</label
      ><select id="clientId" formControlName="clientId">
        @for (client of clients(); track client.id) {
          <option [value]="client.id">{{ client.name }}</option>
        }
      </select>
    </div>
    <div hlmField>
      <label hlmFieldLabel for="name">{{ "cases.name" | translate }}</label
      ><input hlmInput id="name" formControlName="name" required />
    </div>
    <div hlmField>
      <label hlmFieldLabel for="responsibleUserId">{{
        "cases.responsible" | translate
      }}</label
      ><select id="responsibleUserId" formControlName="responsibleUserId">
        @for (user of users(); track user.id) {
          <option [value]="user.id">{{ user.name }}</option>
        }
      </select>
    </div>
    <div hlmField>
      <label hlmFieldLabel for="priority">{{
        "cases.priority" | translate
      }}</label
      ><select id="priority" formControlName="priority">
        <option value="LOW">LOW</option>
        <option value="NORMAL">NORMAL</option>
        <option value="HIGH">HIGH</option>
        <option value="URGENT">URGENT</option>
      </select>
    </div>
    <div hlmField>
      <label hlmFieldLabel for="caseTypeId">{{
        "cases.type" | translate
      }}</label
      ><select id="caseTypeId" formControlName="caseTypeId">
        <option value=""></option>
        @for (type of types(); track type.id) {
          <option [value]="type.id">{{ type.name }}</option>
        }
      </select>
    </div>
    <div hlmField>
      <label hlmFieldLabel for="practiceAreaId">{{
        "cases.area" | translate
      }}</label
      ><select id="practiceAreaId" formControlName="practiceAreaId">
        <option value=""></option>
        @for (area of areas(); track area.id) {
          <option [value]="area.id">{{ area.name }}</option>
        }
      </select>
    </div>
    <div hlmField>
      <label hlmFieldLabel for="openedDate">{{
        "cases.opened" | translate
      }}</label
      ><input
        hlmInput
        id="openedDate"
        type="date"
        formControlName="openedDate"
      />
    </div>
    <div hlmField>
      <label hlmFieldLabel for="externalReference">{{
        "cases.reference" | translate
      }}</label
      ><input
        hlmInput
        id="externalReference"
        formControlName="externalReference"
      />
    </div>
    <div hlmField>
      <label hlmFieldLabel for="confidentialityLevel">{{
        "cases.confidentiality" | translate
      }}</label
      ><input
        hlmInput
        id="confidentialityLevel"
        formControlName="confidentialityLevel"
      />
    </div>
    <div hlmField>
      <label hlmFieldLabel for="description">{{
        "cases.description" | translate
      }}</label
      ><textarea id="description" formControlName="description"></textarea>
    </div>
    <button hlmBtn type="submit" [disabled]="saving()">
      {{ (saving() ? "cases.saving" : "cases.save") | translate }}
    </button>
    <a hlmBtn routerLink="/cases">{{ "cases.cancel" | translate }}</a>
  </form>
}
