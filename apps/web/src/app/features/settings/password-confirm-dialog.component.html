<form
  class="flex flex-col gap-4"
  [formGroup]="form"
  (ngSubmit)="submit()"
  novalidate
>
  <div hlmDialogHeader>
    <h2 hlmDialogTitle>{{ data.title | translate }}</h2>
    <p hlmDialogDescription>{{ data.description | translate }}</p>
  </div>

  <div hlmField>
    <label hlmFieldLabel for="confirm-current-password">
      {{ "auth.mfa.currentPassword" | translate }}
    </label>
    <input
      hlmInput
      id="confirm-current-password"
      class="w-full"
      type="password"
      formControlName="currentPassword"
      autocomplete="current-password"
      required
    />
  </div>

  @if (errorKey()) {
    <p class="text-destructive text-sm" role="alert">
      {{ errorKey() | translate }}
    </p>
  }

  <div hlmDialogFooter class="flex justify-end">
    <button
      hlmBtn
      variant="ghost"
      type="button"
      [disabled]="submitting()"
      (click)="cancel()"
    >
      {{ "common.cancel" | translate }}
    </button>
    <button
      hlmBtn
      type="submit"
      [variant]="data.destructive ? 'destructive' : 'default'"
      [disabled]="submitting() || form.invalid"
    >
      @if (submitting()) {
        <hlm-spinner aria-hidden="true" />
      }
      {{ data.confirmText | translate }}
    </button>
  </div>
</form>
