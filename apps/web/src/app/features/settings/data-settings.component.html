<div class="px-4 py-6 md:px-8">
  <header class="max-w-4xl border-b border-border pb-4">
    <h2 class="text-base font-semibold">{{ "settings.data" | translate }}</h2>
    <p class="text-muted-foreground mt-1 text-sm leading-snug">
      {{ "settings.dataDescription" | translate }}
    </p>
  </header>

  <section
    class="mt-8 flex max-w-4xl flex-col gap-4 border-t border-border pt-6 sm:flex-row sm:items-start sm:justify-between sm:gap-8"
  >
    <div class="min-w-0 flex-1">
      <h3 class="text-sm font-semibold">
        {{ "settings.clearHistory" | translate }}
      </h3>
      <p class="text-muted-foreground mt-1 text-sm leading-snug">
        {{ "settings.clearHistoryHint" | translate }}
      </p>
    </div>
    <button
      class="shrink-0 self-start"
      hlmBtn
      variant="destructive"
      type="button"
      [disabled]="clearing()"
      (click)="clearHistory()"
    >
      {{
        (clearing() ? "settings.deleting" : "settings.clearHistory") | translate
      }}
    </button>
  </section>
</div>
