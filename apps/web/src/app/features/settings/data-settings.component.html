<div class="settings-section-header">
  <div>
    <h2>{{ "settings.data" | translate }}</h2>
    <p>{{ "settings.dataDescription" | translate }}</p>
  </div>
</div>
<div class="danger-zone">
  <div>
    <h3>{{ "settings.clearHistory" | translate }}</h3>
    <p>{{ "settings.clearHistoryHint" | translate }}</p>
  </div>
  <button
    mat-stroked-button
    color="warn"
    type="button"
    [disabled]="clearing()"
    (click)="clearHistory()"
  >
    {{
      (clearing() ? "settings.deleting" : "settings.clearHistory") | translate
    }}
  </button>
</div>
