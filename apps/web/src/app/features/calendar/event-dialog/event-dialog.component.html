<hlm-dialog-header>
  <h2 hlmDialogTitle>
    {{
      (eventId ? "calendar.changeEvent" : "calendar.createEvent") | translate
    }}
  </h2>
  <p hlmDialogDescription>
    {{ "calendar.eventDialogDescription" | translate }}
  </p>
</hlm-dialog-header>
<form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4" novalidate>
  <div hlmField>
    <label hlmFieldLabel for="event-type">
      {{ "calendar.eventType" | translate }}
    </label>
    <select
      id="event-type"
      formControlName="type"
      class="h-10 rounded-md border border-input bg-background px-3 text-sm"
    >
      <option value="MEETING">{{ "calendar.type.meeting" | translate }}</option>
      <option value="HEARING">{{ "calendar.type.hearing" | translate }}</option>
      <option value="CALL">{{ "calendar.type.call" | translate }}</option>
      <option value="OTHER">{{ "calendar.type.other" | translate }}</option>
    </select>
  </div>
  <div hlmField>
    <label hlmFieldLabel for="event-title">
      {{ "calendar.eventTitle" | translate }}
    </label>
    <input hlmInput id="event-title" formControlName="title" />
  </div>
  <div class="grid gap-4 md:grid-cols-2">
    <div hlmField>
      <label hlmFieldLabel for="event-start">
        {{ "calendar.startsAt" | translate }}
      </label>
      <input
        hlmInput
        id="event-start"
        type="datetime-local"
        formControlName="startsAt"
      />
    </div>
    <div hlmField>
      <label hlmFieldLabel for="event-end">
        {{ "calendar.endsAt" | translate }}
      </label>
      <input
        hlmInput
        id="event-end"
        type="datetime-local"
        formControlName="endsAt"
      />
    </div>
  </div>
  <div hlmField>
    <label hlmFieldLabel for="event-location">
      {{ "calendar.location" | translate }}
    </label>
    <input hlmInput id="event-location" formControlName="location" />
  </div>
  <div hlmField>
    <label hlmFieldLabel for="event-description">
      {{ "calendar.description" | translate }}
    </label>
    <textarea
      hlmTextarea
      id="event-description"
      formControlName="description"
    ></textarea>
  </div>
  <hlm-dialog-footer class="flex justify-end gap-2">
    <button
      hlmBtn
      type="button"
      variant="outline"
      [disabled]="saving()"
      (click)="dialogRef.close()"
    >
      {{ "common.cancel" | translate }}
    </button>
    <button hlmBtn type="submit" [disabled]="saving()">
      @if (saving()) {
        <hlm-spinner />
      }
      {{ "common.save" | translate }}
    </button>
  </hlm-dialog-footer>
</form>
