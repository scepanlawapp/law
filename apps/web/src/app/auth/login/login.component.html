<main aria-label="Sign in form">
  <header class="flex">
    <a href="#">{{ "auth.needHelp" | translate }}<span>?</span></a>
  </header>

  <div>
    <h3>{{ "auth.welcomeBack" | translate }}</h3>
    <p>{{ "auth.signInDescription" | translate }}</p>

    <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      <div hlmField>
        <label hlmFieldLabel for="email">{{
          "auth.emailAddress" | translate
        }}</label>
        <div class="flex items-center">
          <ng-icon name="lucideMail" aria-hidden="true" />
          <input
            hlmInput
            id="email"
            type="email"
            formControlName="email"
            required
            autocomplete="email"
            [placeholder]="'auth.emailPlaceholder' | translate"
          />
        </div>
      </div>

      <div hlmField>
        <label hlmFieldLabel for="password">{{
          "auth.password" | translate
        }}</label>
        <div class="flex items-center">
          <ng-icon name="lucideLock" aria-hidden="true" />
          <input
            hlmInput
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            required
            autocomplete="current-password"
            [placeholder]="'auth.passwordPlaceholder' | translate"
          />

          <button
            hlmBtn
            variant="ghost"
            size="icon"
            type="button"
            [attr.aria-label]="'auth.togglePassword' | translate"
            (click)="togglePasswordVisibility()"
          >
            <ng-icon [name]="showPassword ? 'lucideEyeOff' : 'lucideEye'" />
          </button>
        </div>
      </div>

      @if (error) {
        <p role="alert">{{ error }}</p>
      }

      <a routerLink="/forgot-password">{{
        "auth.forgotPassword" | translate
      }}</a>

      <button hlmBtn type="submit" [disabled]="submitting">
        <span>{{
          (submitting ? "auth.signingIn" : "auth.signIn") | translate
        }}</span>
        <ng-icon name="lucideArrowRight" aria-hidden="true" />
      </button>
    </form>
  </div>

  <footer class="flex">
    <span>{{ "auth.dontHaveAccount" | translate }}</span>
    <a href="#">{{ "auth.contactAdministrator" | translate }}</a>
  </footer>
</main>
