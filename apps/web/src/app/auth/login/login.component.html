<main class="login-page">
  <section class="promo-panel" aria-label="Legal platform overview">
  </section>

  <aside class="auth-panel" aria-label="Sign in form">
    <header class="topbar">
      <a href="#" class="help-link">Need help?<span>?</span></a>
    </header>

    <div class="auth-card">
      <h3>Welcome back</h3>
      <p>Sign in to your account to continue</p>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email address</mat-label>
          <mat-icon matPrefix>mail</mat-icon>
          <input
            matInput
            type="email"
            formControlName="email"
            required
            autocomplete="email"
            placeholder="you@company.com"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
          />

          <button
            mat-icon-button
            matSuffix
            type="button"
            aria-label="Toggle password visibility"
            (click)="togglePasswordVisibility()"
          >
            <mat-icon>{{ showPassword ? "visibility_off" : "visibility" }}</mat-icon>
          </button>
        </mat-form-field>

        @if (error) {
          <p class="error-message" role="alert">{{ error }}</p>
        }

        <a href="#" class="forgot-password">Forgot password?</a>

        <button mat-flat-button class="sign-in-button" type="submit" [disabled]="submitting">
          <span>{{ submitting ? "Signing in..." : "Sign in" }}</span>
          <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </button>
      </form>
    </div>

    <footer class="auth-footer">
      <span>Don't have an account?</span>
      <a href="#">Contact your administrator</a>
    </footer>
  </aside>
</main>
