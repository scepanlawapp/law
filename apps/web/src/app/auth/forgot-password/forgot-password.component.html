<main>
  <div>
    <p>Law workspace</p>
    <h1>{{ "auth.forgotPassword" | translate }}</h1>
    <form (ngSubmit)="submit()">
      <div hlmField>
        <label hlmFieldLabel for="email">Email</label>
        <input
          hlmInput
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
        />
      </div>
      @if (sent()) {
        <p role="status">{{ "auth.resetLinkSent" | translate }}</p>
      }
      <button hlmBtn type="submit" [disabled]="submitting()">
        {{ (submitting() ? "auth.sending" : "auth.sendResetLink") | translate }}
      </button>
      <a routerLink="/login">{{ "auth.returnToSignIn" | translate }}</a>
    </form>
  </div>
</main>
