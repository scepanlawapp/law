<main class="password-content">
  <div class="password-card">
    <p class="eyebrow">Law workspace</p>
    <h1>{{ "auth.forgotPassword" | translate }}</h1>
    <form (ngSubmit)="submit()">
      <label
        >Email
        <input
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
      /></label>
      @if (sent()) {
        <p role="status">{{ "auth.resetLinkSent" | translate }}</p>
      }
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button type="submit" [disabled]="submitting()">
        {{ (submitting() ? "auth.sending" : "auth.sendResetLink") | translate }}
      </button>
      <a routerLink="/login">{{ "auth.returnToSignIn" | translate }}</a>
    </form>
  </div>
</main>
