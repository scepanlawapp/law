<main>
  <div>
    <p>Law workspace</p>
    <h1>{{ "auth.resetPassword" | translate }}</h1>
    <form (ngSubmit)="submit()">
      <div hlmField>
        <label hlmFieldLabel for="password">{{
          "auth.password" | translate
        }}</label>
        <input
          hlmInput
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          minlength="12"
          required
          autocomplete="new-password"
        />
      </div>
      @if (complete()) {
        <p role="status">
          {{ "auth.passwordUpdated" | translate }}
          <a routerLink="/login">{{ "auth.signIn" | translate }}</a>
        </p>
      }
      <button hlmBtn type="submit" [disabled]="submitting() || complete()">
        {{
          (submitting() ? "auth.updating" : "auth.updatePassword") | translate
        }}
      </button>
    </form>
  </div>
</main>
