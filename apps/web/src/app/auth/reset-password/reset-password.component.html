<main class="password-content">
  <div class="password-card">
    <p class="eyebrow">Law workspace</p>
    <h1>{{ "auth.resetPassword" | translate }}</h1>
    <form (ngSubmit)="submit()">
      <label
        >{{ "auth.password" | translate }}
        <input
          name="password"
          type="password"
          [(ngModel)]="password"
          minlength="12"
          required
          autocomplete="new-password"
      /></label>
      @if (complete()) {
        <p role="status">
          {{ "auth.passwordUpdated" | translate }}
          <a routerLink="/login">{{ "auth.signIn" | translate }}</a>
        </p>
      }
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button type="submit" [disabled]="submitting() || complete()">
        {{
          (submitting() ? "auth.updating" : "auth.updatePassword") | translate
        }}
      </button>
    </form>
  </div>
</main>
