<article class="relative flex items-start">
  <div class="grid shrink-0 place-items-center">
    <ng-icon [name]="icon()" />
  </div>
  <div class="grid min-w-0">
    <span>{{ title() | translate }}</span>
    <strong>{{ value() }}</strong>
    <span
      class="flex items-center"
      [class.down]="trendDirection() === 'down'"
      [class.neutral]="trendDirection() === 'neutral'"
    >
      <ng-icon
        [name]="
          trendDirection() === 'down'
            ? 'lucideTrendingDown'
            : trendDirection() === 'neutral'
              ? 'lucideMinus'
              : 'lucideTrendingUp'
        "
      />
      {{ trend() }}
      <small>{{ trendDetail() | translate }}</small>
    </span>
  </div>
  @if (chart().length) {
    <div class="ml-auto mt-auto flex items-end" aria-hidden="true">
      @for (point of chart(); track $index) {
        <span class="flex-1" [style.height.%]="point"></span>
      }
    </div>
  }
</article>
