<ul class="flex flex-col gap-2">
  @for (item of items(); track item.id) {
    <li>
      <button
        type="button"
        class="flex w-full items-start justify-between gap-3 rounded-lg border border-border p-2 text-start text-sm hover:bg-accent"
        (click)="itemSelected.emit(item)"
      >
        <span class="min-w-0">
          <span class="block truncate font-medium">{{ item.title }}</span>
          <span class="text-muted-foreground">
            {{ "work.recordType." + item.sourceType.toLowerCase() | translate }}
            · {{ when(item) }}
            @if (item.overdue) {
              ·
              <span class="text-destructive">
                {{ "work.overdue" | translate }}
              </span>
            }
          </span>
        </span>
      </button>
    </li>
  } @empty {
    <li class="py-2 text-sm text-muted-foreground">
      {{ "dashboard.noUpcomingObligations" | translate }}
    </li>
  }
</ul>
