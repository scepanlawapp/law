<ul class="flex flex-col gap-3">
  @for (item of items(); track item.id) {
    <li class="flex items-start justify-between gap-3 text-sm">
      <div class="min-w-0">
        <p>
          {{ item.labelKey | translate }}
          @if (item.actorName) {
            <span class="text-muted-foreground">· {{ item.actorName }}</span>
          }
        </p>
        @if (entityLink(item); as link) {
          <a [routerLink]="link" class="text-primary hover:underline">
            {{ "dashboard.viewRelatedRecord" | translate }}
          </a>
        }
      </div>
      <time class="shrink-0 text-xs text-muted-foreground">
        {{ item.occurredAt | date: "short" }}
      </time>
    </li>
  }
</ul>
