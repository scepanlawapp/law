services:
  postgres-platform:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: law_platform
      POSTGRES_USER: law
      POSTGRES_PASSWORD: law
    ports:
      - "5432:5432"
    volumes:
      - postgres-platform-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law -d law_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-tenant:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: law_tenant
      POSTGRES_USER: law
      POSTGRES_PASSWORD: law
    ports:
      - "5433:5432"
    volumes:
      - postgres-tenant-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law -d law_tenant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

